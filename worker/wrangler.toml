name = "nmt-relay"
main = "src/index.ts"
compatibility_date = "2024-11-01"

[observability]
enabled = true

# 部署后地址取决于 Cloudflare 账号的 workers.dev 子域名设置：
# 账号子域名若为 "montage"，本 Worker 最终地址即 nmt-relay.montage.workers.dev
# 子域名在 Cloudflare Dashboard → Workers & Pages → 右上角设置一次性配置，非本文件控制。

# 允许发起请求的静态站点 Origin，只到域名这一级，不含子路径
[vars]
ALLOWED_ORIGIN = "https://subs.js.org"
MAX_BATCH_CHARS = "60000"

# Cloudflare 原生按 Key 限流绑定，不占用 KV 配额。
# 当前 wrangler 对 Rate Limiting 绑定的配置语法请以 Cloudflare 最新文档为准，
# 下方写法基于 unsafe.bindings 通用挂载方式，部署前请核对一次。
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

# 以下均通过 `npx wrangler secret put <NAME>` 单独写入，不进本文件：
#   WORKER_SECRET          HMAC签名密钥，任意长随机字符串，自行生成保管
#   TURSO_URL               形如 https://<db>-<org>.turso.io
#   TURSO_AUTH_TOKEN         Turso 数据库鉴权 token
#   TURNSTILE_SECRET_KEY     Cloudflare Turnstile 后台密钥
#   GOOGLE_TRANSLATE_API_KEY 可选，未设置时走匿名上游端点
