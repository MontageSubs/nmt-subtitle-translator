name = "nmt-relay"
main = "src/index.ts"
compatibility_date = "2024-11-01"

[observability]
enabled = true

# 部署后地址取决于 Cloudflare 账号的 workers.dev 子域名设置：
# 账号子域名若为 "montage"，本 Worker 最终地址即 nmt-relay.montage.workers.dev
# 子域名在 Cloudflare Dashboard → Workers & Pages → 右上角设置一次性配置，非本文件控制。

# 允许发起请求的静态站点 Origin，只到域名这一级，不含子路径
[vars]
ALLOWED_ORIGIN = "https://subs.js.org"
MAX_BATCH_CHARS = "8000"
# 限流最小计费单位（字符），单次 /translate 按 ceil(字符数/该值) 计入下方 RATE_LIMITER 的 hits，
# 使限流天然按字符总量计费而非请求次数，任务内分片越多不代表限得越紧。
RATE_LIMIT_UNIT_CHARS = "500"

# Cloudflare 原生按 Key 限流绑定，周期结束自动回填，无需任何存储代码。
# limit 按上方 RATE_LIMIT_UNIT_CHARS 折算：600 hits × 500 字符 = 每 60 秒 30 万字符预算，
# 覆盖一次完整翻译任务的所有分片仍留有余量，真正的持续滥用才会触顶。
# 当前 wrangler 对 Rate Limiting 绑定的配置语法请以 Cloudflare 最新文档为准，
# 下方写法基于 unsafe.bindings 通用挂载方式，部署前请核对一次。
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 600, period = 60 }

# D1 数据库：存两张表——ip_reputation（隔离期/封禁，只有触发违规信号的 IP 才写入）与
# nonce_guard（每次 /translate 的重放防护，主键唯一约束做全局原子的"写入即消费"，
# 取代此前按数据中心本地隔离、非全局一致的 Cache API 方案）。两表均由 scheduled() 每日定时清理
# 过期行，体积恒定。翻译计数走 Turso（见下方 secrets），互不占用彼此配额。
# database_id 不写入本文件明文：先执行一次
#   npx wrangler d1 create nmt-relay
# 把返回的 id 存进 GitHub Secrets 的 D1_DATABASE_ID，deploy-worker.yml 部署时用 sed 注入替换
# 下方占位符，本文件在仓库里始终保持占位符原样。表结构由各自模块首次调用时自动建立。
[[d1_databases]]
binding = "DB"
database_name = "nmt-relay"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

# 两条定时任务，按 cron 表达式在 index.ts 的 scheduled() 内分派：
#   17 3 * * *  每日清理 ip_reputation 过期记录与 nonce_guard 过期 nonce，保持两表体积恒定
#   0  4 * * 7  每周日密钥自轮换（见下方 WORKER_SECRET 说明），修改本行需同步改 index.ts 的 ROTATION_CRON 常量
#   注：Cloudflare 的 Cron Triggers 星期字段不接受 0，周日必须写 7（1=周一...7=周日）
[triggers]
crons = ["17 3 * * *", "0 4 * * 7"]

# 以下均通过 GitHub 仓库 Settings → Secrets and variables → Actions → Secrets 配置，
# 由 deploy-worker.yml 在每次部署时自动 `wrangler secret put` 下发，不写入本文件：
#   TURSO_URL               形如 https://<db>-<org>.turso.io，承载翻译计数写入
#   TURSO_AUTH_TOKEN         Turso 数据库鉴权 token
#   TURNSTILE_SECRET_KEY     Cloudflare Turnstile 后台密钥
#   GOOGLE_TRANSLATE_API_KEY 可选，未设置时走匿名上游端点
#   WORKER_SALT              人工设置一次的静态盐，极少变动，与轮换密钥一起派生出实际签名密钥
#   CF_API_TOKEN             与部署用的 CLOUDFLARE_API_TOKEN 同一个值，额外下发给 Worker 自身，
#                            供 scheduled() 里的自轮换逻辑调用 Cloudflare 管理 API 改写自己的 secret；
#                            该 token 需具备 Workers Scripts:Edit 权限——部署流程本就要求这个权限，
#                            这里只是把同一份凭证再交给 Worker 运行时持有一份，不引入新的信任层级
#   CF_ACCOUNT_ID            与部署用的 CLOUDFLARE_ACCOUNT_ID 同一个值，同上原因下发给 Worker
# 另需配置 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID（Secrets）供 wrangler 本身鉴权。
#
# WORKER_SECRET 不经 GitHub 流转、也不由 deploy-worker.yml 同步：
#   首次部署前手动执行一次 `npx wrangler secret put WORKER_SECRET`，随意填入一段长随机字符串即可
#   （无需三行格式，缺失的 previous/rotatedAt 会被自动忽略）。此后每周日由 Worker 自己调用
#   Cloudflare 管理 API 原地轮换：当前值降级为"上一个"，生成新值作为"当前"，写入 unix 秒时间戳；
#   验证逻辑发现某次请求的 token 是用"上一个"密钥签的，且轮换时间在 1 小时内，仍放行——
#   超过 1 小时自然只读第一行，无需任何额外操作使旧密钥失效。GitHub 侧永远不持有这个值的明文。
#
# Turnstile site key（公开信息，非敏感）配置在 GitHub 仓库 Variables：
#   TURNSTILE_SITE_KEY，构建时注入前端为 VITE_TURNSTILE_SITE_KEY（见 deploy-pages.yml）
